name = "cloudflare-shopify-starter"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

# Set your Cloudflare account ID:
#   wrangler whoami    # to find it
account_id = "d10ba4c560d604156b4f8377da2229d6"

# Serve built frontend assets (Vite output)
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true
binding = "ASSETS"

# Add a custom domain once DNS is on Cloudflare:
# routes = [
#   { pattern = "app.yourdomain.com", custom_domain = true },
# ]

# ─── D1 ─────────────────────────────────────────────────────────────────────
# Create with: wrangler d1 create cloudflare-shopify-starter-db
# Then paste the returned database_id below.
[[d1_databases]]
binding          = "DB"
database_name    = "cloudflare-shopify-starter-db"
database_id      = "<replace-me-d1-id>"
migrations_dir   = "drizzle/migrations"

# ─── KV (sessions) ──────────────────────────────────────────────────────────
# Create with: wrangler kv:namespace create SESSION_KV
[[kv_namespaces]]
binding = "SESSION_KV"
id      = "<replace-me-kv-id>"

# ─── R2 (file storage) ──────────────────────────────────────────────────────
# Create with: wrangler r2 bucket create cloudflare-shopify-starter-files
[[r2_buckets]]
binding     = "R2"
bucket_name = "cloudflare-shopify-starter-files"

# ─── OPTIONAL: Queues ────────────────────────────────────────────────────────
# Uncomment + create the queues to use background processing.
#   wrangler queues create example-queue
# [[queues.producers]]
# binding = "EXAMPLE_QUEUE"
# queue   = "example-queue"
#
# [[queues.consumers]]
# queue          = "example-queue"
# max_batch_size = 10

# ─── OPTIONAL: Durable Objects (rate limiting, coordination) ─────────────────
# [[durable_objects.bindings]]
# name       = "RATE_LIMITER"
# class_name = "RateLimiter"
#
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["RateLimiter"]

# ─── OPTIONAL: Cron triggers ────────────────────────────────────────────────
# [triggers]
# crons = ["0 * * * *"]   # hourly

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
